name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test capture and privacy contracts
        run: python -m unittest discover -s tests -v

  desktop:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type-check and build
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package-lock.json') }}
      - name: Assemble unsigned macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:dir
      - name: Validate application bundle
        run: plutil -lint "dist/mac-arm64/Visual Copilot.app/Contents/Info.plist"
