[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3"]

[project.optional-dependencies]
capture = ["mss>=9.0", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
